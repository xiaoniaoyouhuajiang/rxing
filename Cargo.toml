[package]
name = "rxing_lib"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rxing_lib"
crate-type = ["cdylib"]

[dependencies]
rxing = "0.7.1"
pyo3 = "0.24.0"
rayon = "1.10.0"
anyhow = "1.0.98"
faer = "0.20.1"
sha2 = "0.10.9"
image = { version = "0.25", optional = true } 
imageproc = "0.25.0"
directories = "5.0"
usls = { git = "https://github.com/jamjamjon/usls" }
reqwest = { version = "0.12" , features = ["blocking"]}
hex = "0.4.3"

[features]
default = ["image"]
