  linux:
    name: Build Wheels (Linux)
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64, armv7, ppc64le, s390x] # 主流架构
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          working-directory: rxing-python
          args: --release --out dist --features detection
          manylinux: auto
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: rxing-python/dist

  windows:
    name: Build Wheels (Windows)
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64, x86]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          architecture: ${{ matrix.target }}

      - name: Install ONNX Runtime
        shell: pwsh
        run: |
          $ORT_VERSION = "1.22.0"
          $ORT_URL = "https://github.com/microsoft/onnxruntime/releases/download/v$($ORT_VERSION)/onnxruntime-win-${{ matrix.target }}-$($ORT_VERSION).zip"
          $ORT_ZIP_FILE = "onnxruntime.zip"
          $ORT_EXTRACT_DIR = "ort-runtime"
          Invoke-WebRequest -Uri $ORT_URL -OutFile $ORT_ZIP_FILE
          Expand-Archive -Path $ORT_ZIP_FILE -DestinationPath $ORT_EXTRACT_DIR
          $ORT_LIB_PATH = (Get-ChildItem -Path $ORT_EXTRACT_DIR -Recurse -Directory -Filter "lib").FullName
          echo $ORT_LIB_PATH | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          working-directory: rxing-python
          args: --release --out dist --features detection
          sccache: 'true'

      - name: Repair wheels with delvewheel
        shell: pwsh
        run: |
          pip install delvewheel
          delvewheel repair rxing-python/dist/*.whl

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: rxing-python/dist

  macos:
    name: Build Wheels (macOS)
    needs: test
    runs-on: ${{ matrix.target == 'x86_64' && 'macos-13' || 'macos-14' }}
    strategy:
      matrix:
        target: [x86_64, aarch64]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          working-directory: rxing-python
          args: --release --out dist --features detection
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: rxing-python/dist

  sdist:
    name: Build Source Distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: rxing-python
          args: --out dist --features detection
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: rxing-python/dist


  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # needs: build_wheels
    needs: [linux, windows, macos, sdist]
    permissions:
      id-token: write # Required for trusted publishing

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          # No need to specify name, it will download all artifacts

      - name: List downloaded files
        run: dist

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing "dist/**/*.whl" "dist/**/*.tar.gz"
          # The token can be provided via OIDC (trusted publishing) or a secret
          # For trusted publishing, no environment variable is needed.
          # For token, use:
          # env:
          #   MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rxing-python/dist/**/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
