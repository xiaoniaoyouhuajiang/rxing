name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install ONNX Runtime (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh # 使用 PowerShell 以方便执行下载和解压命令
        run: |
          # install onnxruntime.dll
          $ORT_VERSION = "1.22.0"
          $ORT_URL = "https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-win-x64-1.22.0.zip"
          $ORT_ZIP_FILE = "onnxruntime.zip"
          $ORT_EXTRACT_DIR = "ort-runtime"

          echo "Downloading ONNX Runtime v$($ORT_VERSION)..."
          Invoke-WebRequest -Uri $ORT_URL -OutFile $ORT_ZIP_FILE

          echo "Extracting ONNX Runtime..."
          Expand-Archive -Path $ORT_ZIP_FILE -DestinationPath $ORT_EXTRACT_DIR

          $ORT_LIB_PATH = (Get-ChildItem -Path $ORT_EXTRACT_DIR -Recurse -Directory -Filter "lib").FullName
          
          echo "ONNX Runtime library path: $ORT_LIB_PATH"
          $ORT_DLL_PATH = Join-Path $ORT_LIB_PATH "onnxruntime.dll"
          echo "Setting ORT_DYLIB_PATH to $ORT_DLL_PATH"
          echo "ORT_DYLIB_PATH=$ORT_DLL_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
          echo "Adding to PATH environment variable..."
          echo $ORT_LIB_PATH | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Rust tests for all workspace members
      # download the pretrained model first to avoid checksum mismatch
        run: |
          cargo test -p rxing-detection detection::detector::tests::test_detector
          cargo test -p rxing-detection --all-features --verbose
      - name: Create and configure virtual environment
        run: |
          python -m venv .venv
          echo ".venv/bin" >> $GITHUB_PATH 
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
        shell: bash
        if: runner.os != 'Windows'
      - name: Create and configure virtual environment (Windows)
        run: |
          python -m venv .venv
          echo ".venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "VIRTUAL_ENV=$PWD\.venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh
        if: runner.os == 'Windows'
      # - name: Install Python dependencies
      #   run: pip install maturin pytest Pillow numpy
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest
      - name: Run Python tests (with detection feature)
        run: |
          # Install with detection feature
          maturin develop --manifest-path rxing-python/Cargo.toml --features detection
          pytest tests/

