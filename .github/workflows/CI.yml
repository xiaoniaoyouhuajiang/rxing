  #       with:
  #         # We need to tell maturin where the python package is
  #         working-directory: rxing-python
  #         args: --release --out dist --find-interpreter

  #     - name: Build wheels (with detection feature)
  #       uses: PyO3/maturin-action@v1
  #       with:
  #         working-directory: rxing-python
  #         args: --release --out dist --find-interpreter --features detection
  #         # The output wheel filename will be different due to feature flags,
  #         # e.g., rxing-0.2.0+detection-cp38-cp38-manylinux_x86_64.whl

  #     - name: Repair wheels with delvewheel (Windows)
  #       if: matrix.os == 'windows-latest'
  #       shell: pwsh
  #       run: |
  #         pip install delvewheel
  #         delvewheel repair rxing-python/dist/*.whl

  #     - name: Upload wheels
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: wheels-${{ matrix.os }}
